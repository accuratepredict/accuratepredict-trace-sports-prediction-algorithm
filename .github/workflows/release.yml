name: release
# Publishes a GitHub release for the newest version in CHANGELOG.md.
# Runs on GitHub, so the release is published by github-actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["CHANGELOG.md", ".github/workflows/release.yml"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the newest version and notes from CHANGELOG
        run: |
          python - <<'PY'
          import re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## (\S+).*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          version, body = m.group(1), m.group(2).strip()
          body += "\n\nMore at https://accuratepredict.com"
          open("NOTES.md", "w", encoding="utf-8").write(body)
          open("VERSION", "w").write(version)
          PY
      - name: Publish release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(cat VERSION)"
          if gh release view "$V" >/dev/null 2>&1; then echo "$V already released"; exit 0; fi
          gh release create "$V" --target "$GITHUB_SHA" --title "AccuratePredict TRACE ${V#v}" --notes-file NOTES.md
