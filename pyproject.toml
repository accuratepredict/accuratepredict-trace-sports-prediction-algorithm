[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "accuratepredict-trace"
version = "0.1.0"
description = "AccuratePredict TRACE: open framework for timestamped, calibrated sports prediction (Dixon-Coles, Elo, calibration, evaluation)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "AccuratePredict", email = "accuratepredictz@gmail.com"}]
keywords = ["sports prediction", "football prediction", "dixon-coles", "elo", "calibration", "brier score", "forecasting"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://accuratepredict.com"
Methodology = "https://accuratepredict.com/how-we-make-predictions"
"Accuracy record" = "https://accuratepredict.com/prediction-accuracy"
Source = "https://github.com/accuratepredict/accuratepredict-trace"

[tool.setuptools]
packages = ["accuratepredict_trace", "accuratepredict_trace.ratings"]
